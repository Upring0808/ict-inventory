<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#047857">
    <title>ICT Inventory · Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8fafc; color: #18181b; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 28rem; border: 1px solid #d4d4d8; border-radius: 1rem; background: white; padding: 1.5rem; }
      h1 { margin: 0; font-size: 1.25rem; }
      p { margin: .75rem 0 1.25rem; color: #52525b; line-height: 1.6; }
      button { min-height: 2.75rem; border: 0; border-radius: .65rem; background: #047857; padding: .65rem 1rem; color: white; font: inherit; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet, then reload ICT Inventory to continue.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
